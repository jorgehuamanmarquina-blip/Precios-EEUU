<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Ganancias</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background:#f4f4f4;
        padding:40px;
    }

    .contenedor{
        max-width:500px;
        margin:auto;
        background:white;
        padding:25px;
        border-radius:15px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h2{
        text-align:center;
    }

    input{
        width:100%;
        padding:12px;
        font-size:18px;
        margin-top:10px;
        border-radius:10px;
        border:1px solid #ccc;
    }

    button{
        width:100%;
        padding:12px;
        margin-top:15px;
        border:none;
        border-radius:10px;
        background:#007bff;
        color:white;
        font-size:18px;
        cursor:pointer;
    }

    .resultado{
        margin-top:20px;
        background:#f9f9f9;
        padding:15px;
        border-radius:10px;
    }

    p{
        font-size:18px;
    }
</style>
</head>

<body>

<div class="contenedor">

<h2>Calculadora de Ganancias</h2>

<label>Precio del producto en dólares:</label>
<input type="number" id="precio" placeholder="Ejemplo: 48">

<button onclick="calcular()">Calcular</button>

<div class="resultado" id="resultado"></div>

</div>

<script>

function calcular(){

    let precio = parseFloat(document.getElementById("precio").value);

    if(isNaN(precio)){
        alert("Ingresa un número válido");
        return;
    }

    // COSTO REAL
    let costo = precio * 1.26 * 3.5;

    // fórmula correcta:
    // venta = costo / (1 - margen)

    let venta15 = costo / (1 - 0.15);
    let venta20 = costo / (1 - 0.20);
    let venta25 = costo / (1 - 0.25);
    let venta30 = costo / (1 - 0.30);

    document.getElementById("resultado").innerHTML = `
        <p><strong>Costo final:</strong> S/ ${costo.toFixed(2)}</p>

        <hr>

        <p>Ganancia 15% → <strong>S/ ${venta15.toFixed(2)}</strong></p>

        <p>Ganancia 20% → <strong>S/ ${venta20.toFixed(2)}</strong></p>

        <p>Ganancia 25% → <strong>S/ ${venta25.toFixed(2)}</strong></p>

        <p>Ganancia 30% → <strong>S/ ${venta30.toFixed(2)}</strong></p>
    `;
}

</script>

</body>
</html>
